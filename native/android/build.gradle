plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.liquidglass'
version = '0.1.0'

android {
  namespace "expo.modules.liquidglass"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // For React Native's touch helpers, so a control that takes a finger tells JavaScript it has.
  implementation 'com.facebook.react:react-android'
}
